<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradient for the outer play button ribbon -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0055FF;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0088FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00DDFF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Speed lines (horizontal pills) on the left -->
  <g fill="url(#grad2)">
    <rect x="50" y="210" width="60" height="15" rx="7.5" />
    <rect x="30" y="240" width="80" height="15" rx="7.5" />
    <rect x="40" y="270" width="70" height="15" rx="7.5" />
  </g>
  <g fill="#00D4FF">
    <circle cx="10" cy="247.5" r="7.5" />
    <circle cx="20" cy="217.5" r="7.5" />
    <circle cx="25" cy="277.5" r="7.5" />
  </g>

  <!-- Outer Play Button Shape -->
  <path d="M 120 150 
           Q 120 100 170 120 
           L 350 210 
           Q 400 235 350 260 
           L 170 350 
           Q 120 375 120 320 
           L 120 280
           A 15 15 0 0 1 150 280
           L 150 320
           Q 150 340 165 330
           L 330 250
           Q 345 240 330 230
           L 165 150
           Q 150 140 150 160
           L 150 190
           A 15 15 0 0 1 120 190 Z" 
        fill="url(#grad1)" />
  
  <path d="M 120 300 
           Q 120 375 180 345
           L 260 305
           L 240 280
           L 165 315
           Q 150 325 150 300 Z" 
        fill="#0044EE" opacity="0.6"/>

  <!-- Inner Dark Blue Triangle -->
  <path d="M 210 200 
           L 290 240 
           Q 300 245 290 250 
           L 210 290 
           Q 200 295 200 280 
           L 200 210 
           Q 200 195 210 200 Z" 
        fill="#0A193F" />
</svg>
