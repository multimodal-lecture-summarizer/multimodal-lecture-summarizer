; Runs every service of the all-in-one image. Environment variables (database URL, Redis URL,
; WORKER_QUEUES, AIO_START_REDIS) are prepared by entrypoint.sh before supervisord starts.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/data -c listen_addresses=127.0.0.1 -c unix_socket_directories=/var/run/postgresql
user=postgres
priority=10
autorestart=true
stopsignal=INT
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:redis]
command=redis-server --bind 127.0.0.1 --dir /var/lib/redis --appendonly yes
user=redis
priority=10
autostart=%(ENV_AIO_START_REDIS)s
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:backend]
command=sh -c "until /usr/lib/postgresql/15/bin/pg_isready -h 127.0.0.1 -q; do sleep 1; done; exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
directory=/app/backend
priority=20
autorestart=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:worker]
command=sh -c "until /usr/lib/postgresql/15/bin/pg_isready -h 127.0.0.1 -q; do sleep 1; done; exec celery -A ai_workers.core.celery_app worker --loglevel=info --pool=solo --concurrency=1 -Q %(ENV_WORKER_QUEUES)s -n aio@%%h"
directory=/app
priority=30
autorestart=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=40
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
