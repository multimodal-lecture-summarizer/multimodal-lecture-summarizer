name: Florence reproducibility

on:
  pull_request:
    paths:
      - "ai_workers/**"
      - ".github/workflows/florence-reproducibility.yml"
  push:
    paths:
      - "ai_workers/**"
      - ".github/workflows/florence-reproducibility.yml"
  workflow_dispatch:

jobs:
  cpu-golden-caption:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUN_FLORENCE_SMOKE_TEST: "1"
      FLORENCE_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai_workers/requirements.txt

      - name: Install verified CPU inference runtime
        run: >-
          python -m pip install
          torch==2.5.1 torchvision==0.20.1
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install verified Florence dependencies
        run: >-
          python -m pip install
          transformers==4.57.6 tokenizers==0.22.2 safetensors==0.8.0
          huggingface-hub==0.36.2 numpy==1.26.4 Pillow==12.2.0
          einops==0.8.2 timm==1.0.27 packaging pydantic-settings

      - name: Verify runtime and golden caption
        run: python -m unittest discover -s ai_workers/tests -p "test_*.py" -v
