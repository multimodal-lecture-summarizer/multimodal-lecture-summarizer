# Full stack on one machine:            docker compose up --build
# Same, with the worker on an NVIDIA GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# GPU worker alone on another machine:  docker compose -f docker-compose.worker.yml up --build
#
# App settings (Groq, R2, Chroma, HF_TOKEN...) come from backend/.env.
# SHARED_REDIS_URL (in ./.env) switches every service to a public Redis so a Colab or
# remote GPU worker can join; leave it empty to use the redis container below.

x-redis-env: &redis-env
  CELERY_BROKER_URL: ${SHARED_REDIS_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${SHARED_REDIS_URL:-redis://redis:6379/1}
  REDIS_URL: ${SHARED_REDIS_URL:-redis://redis:6379/0}

services:
  # ──────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: video_summarizer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Redis (Celery Broker + Result Backend) when SHARED_REDIS_URL is not set
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Backend API (FastAPI)
  # ──────────────────────────────────────────
  backend_api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      <<: *redis-env
      # Used unless backend/.env points POSTGRES_SERVER at a hosted database.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/video_summarizer
    volumes:
      # Backend writes mock storage under backend/storage and serves it from storage/;
      # one host folder for both keeps uploads, keyframes and the worker in sync.
      - ./storage:/app/storage
      - ./storage:/app/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────
  # AI Worker (Celery). CPU by default; docker-compose.gpu.yml adds the GPU and the "gpu" queue.
  # ──────────────────────────────────────────
  ai_worker:
    build:
      context: .
      dockerfile: ai_workers/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      <<: *redis-env
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/video_summarizer
      WORKER_QUEUES: ${WORKER_QUEUES:-celery}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      PROCESS_MIN_AVAILABLE_MEMORY_MB: ${PROCESS_MIN_AVAILABLE_MEMORY_MB:-4096}
      PROCESS_SOFT_MIN_AVAILABLE_MEMORY_MB: ${PROCESS_SOFT_MIN_AVAILABLE_MEMORY_MB:-3072}
      PROCESS_MEMORY_RETRY_SECONDS: ${PROCESS_MEMORY_RETRY_SECONDS:-30}
      PROCESS_MEMORY_RETRY_INTERVAL_SECONDS: ${PROCESS_MEMORY_RETRY_INTERVAL_SECONDS:-5}
      FLORENCE_DEVICE: ${FLORENCE_DEVICE:-cpu}
      ENABLE_FLORENCE_CAPTIONING: ${ENABLE_FLORENCE_CAPTIONING:-1}
      FLORENCE_MAX_CAPTIONS: ${FLORENCE_MAX_CAPTIONS:-4}
      FLORENCE_MIN_AVAILABLE_MEMORY_MB: ${FLORENCE_MIN_AVAILABLE_MEMORY_MB:-6144}
      FLORENCE_MIN_AVAILABLE_VRAM_MB: ${FLORENCE_MIN_AVAILABLE_VRAM_MB:-4096}
      FLORENCE_CPU_NUM_BEAMS: ${FLORENCE_CPU_NUM_BEAMS:-1}
      FLORENCE_CUDA_NUM_BEAMS: ${FLORENCE_CUDA_NUM_BEAMS:-1}
      SEMANTIC_CLIP_DEVICE: ${SEMANTIC_CLIP_DEVICE:-auto}
      PADDLEOCR_USE_GPU: ${PADDLEOCR_USE_GPU:-0}
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      ENABLE_SPRINT_STACK: ${ENABLE_SPRINT_STACK:-1}
      SPRINT_STACK: ${SPRINT_STACK:-recommended}
      MIN_CHAPTER_SEC: ${MIN_CHAPTER_SEC:-45}
    volumes:
      - ./outputs:/app/outputs
      - ./cache:/app/cache
      - ./storage:/app/storage
      - ./storage:/app/backend/storage
      # Live code so host edits to quality_postprocess/tasks apply without rebuild
      - ./ai_workers:/app/ai_workers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────
  # Frontend (React + Nginx). VITE_* is the API URL as seen from the user's browser.
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend_api

volumes:
  postgres_data:
