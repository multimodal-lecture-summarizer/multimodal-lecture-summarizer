services:
  # ──────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: video_summarizer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Redis (Celery Broker + Result Backend)
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Backend API (FastAPI)
  # ──────────────────────────────────────────
  backend_api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/video_summarizer
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────
  # AI Worker (Celery) — intended Docker service for local hybrid setup
  # Backend/frontend run on host; Redis is broker-only for this worker.
  # ──────────────────────────────────────────
  ai_worker:
    build: ./ai_workers
    env_file:
      - ./backend/.env
    environment:
      # Override host Redis URLs from backend/.env with in-compose service name
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      FLORENCE_DEVICE: ${FLORENCE_DEVICE:-cpu}
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      ENABLE_SPRINT_STACK: ${ENABLE_SPRINT_STACK:-1}
      SPRINT_STACK: ${SPRINT_STACK:-recommended}
      MIN_CHAPTER_SEC: ${MIN_CHAPTER_SEC:-45}
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./cache:/app/cache
      - ./storage:/app/storage
      # Live code so host edits to quality_postprocess/tasks apply without rebuild
      - ./ai_workers:/app/ai_workers
    depends_on:
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────
  # Frontend (React + Nginx)
  # ──────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend_api

volumes:
  postgres_data:
