<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - AI Summarizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-main: #f8fafc; --bg-surface: #ffffff; --primary: #4f46e5; --text-main: #0f172a; --text-muted: #64748b; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        .auth-container { background: var(--bg-surface); padding: 40px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        
        .logo { font-size: 1.5rem; font-family: 'Outfit'; font-weight: 700; color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; gap: 10px; margin-bottom: 30px; }
        
        h2 { font-family: 'Outfit'; margin-top: 0; margin-bottom: 10px; color: var(--text-main); }
        p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 30px; }
        
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 8px; color: var(--text-main); }
        .form-group input { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--border); background: #ffffff; color: var(--text-main); outline: none; transition: 0.3s; box-sizing: border-box; font-family: 'Inter'; }
        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1); }
        
        .btn { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; font-family: 'Inter'; }
        .btn:hover { background: #4338ca; }
        
        .divider { display: flex; align-items: center; margin: 25px 0; color: var(--text-muted); font-size: 0.85rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .divider span { padding: 0 15px; }
        
        .btn-google { background: #ffffff; color: var(--text-main); border: 1px solid var(--border); display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-google:hover { background: #f8fafc; border-color: #cbd5e1; }
        
        .footer-text { margin-top: 25px; font-size: 0.9rem; color: var(--text-muted); }
        .footer-text a { color: var(--primary); text-decoration: none; font-weight: 500; }
        .footer-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-container">
        <a href="1_landing.html" class="logo"><i class="fa-solid fa-brain"></i> AI.Summarizer</a>
        <h2>Chào mừng trở lại</h2>
        <p>Đăng nhập để xem lịch sử và phân tích video</p>
        
        <form action="6_history.html">
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Nhập địa chỉ email" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" placeholder="Nhập mật khẩu" required>
            </div>
            
            <div style="display: flex; justify-content: space-between; margin-bottom: 25px; font-size: 0.85rem;">
                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--text-muted);">
                    <input type="checkbox"> Ghi nhớ tôi
                </label>
                <a href="#" style="color: var(--primary); text-decoration: none;">Quên mật khẩu?</a>
            </div>
            
            <button type="submit" class="btn">Đăng Nhập</button>
        </form>
        
        <div class="divider"><span>HOẶC</span></div>
        
        <button class="btn btn-google">
            <i class="fa-brands fa-google" style="color: #ea4335;"></i> Đăng nhập bằng Google
        </button>
        
        <div class="footer-text">
            Chưa có tài khoản? <a href="#">Đăng ký ngay</a>
        </div>
    </div>
</body>
</html>
